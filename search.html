<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Search</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/custom.css" rel="stylesheet" />
    </head>
    <body id="page-top">
        <nav class="navbar navbar-expand-lg bg-secondary text-uppercase fixed-top" id="mainNav">
            <div class="container">
                <a class="navbar-brand" href="home.html">My Digital Space</a>
                <button class="navbar-toggler text-uppercase font-weight-bold bg-primary text-white rounded" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="home.html">Home</a></li>
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="projects.html">Projects</a></li>
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="about.html">About</a></li>
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="achievements.html">Achievements</a></li>
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="notes.html">Notes</a></li>
                        <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded active" href="search.html">Search</a></li>
                        <li class="nav-item mx-0 mx-lg-1">
                            <form class="search-form" action="search.html" method="get">
                                <input class="form-control" type="text" id="searchInput" name="q" placeholder="Search projects or achievements" />
                                <button class="btn btn-primary" type="submit">Go</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <header class="page-hero bg-primary text-white text-center">
            <div class="container">
                <h1 class="mb-3">Search</h1>
                <p class="lead">This search is ready for your real database. For now it filters demo content instantly.</p>
            </div>
        </header>

        <section class="page-section">
            <div class="container">
                <div class="search-card p-4">
                    <form class="search-form mb-4" action="search.html" method="get">
                        <input class="form-control" type="text" id="searchInputInline" name="q" placeholder="Try searching for 'project', 'award', or 'design'" />
                        <button class="btn btn-primary" type="submit">Search</button>
                    </form>
                    <div id="searchResults" class="row g-4"></div>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        <script>
            const records = [
                { title: 'AI Dashboard Project', category: 'Projects', text: 'A modern dashboard project focused on analytics and design.' },
                { title: 'Web Redesign Award', category: 'Achievements', text: 'Won recognition for an outstanding website redesign.' },
                { title: 'Creative Portfolio', category: 'Projects', text: 'A polished portfolio built with Bootstrap and custom styling.' },
                { title: 'Research Publication', category: 'Achievements', text: 'Published a technical article about product design systems.' }
            ];

            const params = new URLSearchParams(window.location.search);
            const searchTerm = (params.get('q') || '').trim().toLowerCase();
            const input = document.getElementById('searchInput');
            const inlineInput = document.getElementById('searchInputInline');
            const results = document.getElementById('searchResults');

            if (input) input.value = searchTerm;
            if (inlineInput) inlineInput.value = searchTerm;

            const filtered = searchTerm
                ? records.filter(item => item.title.toLowerCase().includes(searchTerm) || item.text.toLowerCase().includes(searchTerm) || item.category.toLowerCase().includes(searchTerm))
                : records;

            if (results) {
                if (filtered.length === 0) {
                    results.innerHTML = '<div class="col-12"><div class="feature-card"><h3>No results yet</h3><p>Try another keyword or connect your database later.</p></div></div>';
                } else {
                    results.innerHTML = filtered.map(item => `
                        <div class="col-md-6">
                            <div class="feature-card">
                                <span class="tag-pill">${item.category}</span>
                                <h3 class="mt-3">${item.title}</h3>
                                <p>${item.text}</p>
                            </div>
                        </div>
                    `).join('');
                }
            }
        </script>
    </body>
</html>
